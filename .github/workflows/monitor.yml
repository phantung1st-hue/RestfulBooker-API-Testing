
name: Production API Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      - name: Check Production API Health
        run: |
          newman run Production_Monitor_Demo.postman_collection.json
